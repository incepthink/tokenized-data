name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, midnight-live]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "build: update package-lock.json [skip ci]" && git push) || true
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: timeout 600 npx vite build
      - name: Bundle summary
        run: |
          du -sh dist
          find dist -type f -size +500k -exec ls -la {} \;
